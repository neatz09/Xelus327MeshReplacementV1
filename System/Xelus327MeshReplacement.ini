; Xelus327 Mesh Replacement server configuration
; Copy this file to the UT2004 System directory.
; Use -ini=Xelus327MeshReplacement.ini when starting the server,
; or copy these settings into UT2004.ini.
;
; Adrenaline colors:
; 0 = Green
; 1 = Purple
; 2 = Blue
; 3 = Stock

[Xelus327MeshReplacement.MutXelus327MeshReplacement]
bEnableFixedXWeapons=True
bEnableXelusPickups=True
bEnableXelusAmmoPickups=True
bEnableXelusChargers=True
bEnableXelusJumpPads=True
bEnableHQTextures=True
XelusAdrenalineColor=0
